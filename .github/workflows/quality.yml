name: Device Lab quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  web-and-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build && npm test && npm run test:phone
      - run: python3 -m unittest discover -s tests -p test_updates.py
  phonecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: chmod +x phonecheck/gradlew
      - run: ./gradlew :app:assembleDebug :app:lintDebug
        working-directory: phonecheck
